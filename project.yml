name: Yankit

options:
  bundleIdPrefix: com.yankit
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.29.0"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  Yankit:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources/Assets.xcassets
    dependencies:
      - package: GRDB
      - package: KeyboardShortcuts
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yankit.app
        # The app version: shown in Settings → About and used for releases.
        # Bump it before releasing (see docs/RELEASING.md).
        MARKETING_VERSION: "1.4.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        # The EdDSA public key that update archives are checked against.
        # Paste the key printed by Sparkle's generate_keys here (see
        # docs/RELEASING.md). While empty, the build has no updater.
        SPARKLE_PUBLIC_KEY: "fHu+dsMu8HEriacv3AlFWYjU5qDvFM0AGGtwCrFI3PY="
      configs:
        # Required for notarization. Release only, so Debug test runs can
        # still load the test bundle into the app.
        Release:
          ENABLE_HARDENED_RUNTIME: YES

  YankitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: Yankit
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yankit.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"

schemes:
  Yankit:
    build:
      targets:
        Yankit: all
        YankitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YankitTests
