name: Release

# Releases the version in project.yml (MARKETING_VERSION). Either:
#   - push its tag:  git tag v1.3.0 && git push origin v1.3.0
#   - or click "Run workflow" on the Actions tab (from main); the tag is
#     created for you.
# See docs/RELEASING.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    # Needs an Xcode with the macOS 26 SDK (Liquid Glass panel background).
    runs-on: macos-15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # XcodeGen generates a current project format; pick a matching Xcode
      # so xcodebuild can read it (the runner default can lag behind).
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # project.yml is the single source of the version, so the release,
      # its tag, and Settings → About always agree.
      - name: Read version from project.yml
        run: |
          VERSION=$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' project.yml)
          TAG="v$VERSION"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $VERSION in project.yml"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Run the release from main, not $GITHUB_REF_NAME"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "::error::$TAG already exists. Bump MARKETING_VERSION in project.yml first."
              exit 1
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run tests
        run: |
          xcodebuild test \
            -project Yankit.xcodeproj \
            -scheme Yankit \
            -destination 'platform=macOS' \
            -derivedDataPath build

      - name: Build Release (unsigned)
        run: |
          xcodebuild \
            -project Yankit.xcodeproj \
            -scheme Yankit \
            -configuration Release \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package DMG
        run: |
          APP="build/Build/Products/Release/Yankit.app"
          STAGING="dmg-staging"
          mkdir "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname "Yankit" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "Yankit-${VERSION}.dmg"

      # For a button run the tag doesn't exist yet; --target creates it on
      # the commit that was built.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "Yankit-${VERSION}.dmg" \
            --target "$GITHUB_SHA" \
            --title "Yankit $VERSION" \
            --generate-notes
